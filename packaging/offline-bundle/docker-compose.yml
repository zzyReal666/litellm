name: ${COMPOSE_PROJECT_NAME:-litellm}

services:
  litellm:
    image: litellm-zhcn:v1.106.0-zh.16
    restart: unless-stopped
    cap_add: [ALL]
    ports:
      - "${LITELLM_BIND:-0.0.0.0}:${LITELLM_PORT:-4000}:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
      UI_LOGO_PATH: /app/assets/logo.png
      LITELLM_PRODUCT_LICENSE_ENABLED: "True"
      LITELLM_PRODUCT_LICENSE_FILE: /app/data/product_license.lic
      LITELLM_PRODUCT_NAME: ${LITELLM_PRODUCT_NAME:-AI}
      LITELLM_PRODUCT_CODE: ${LITELLM_PRODUCT_CODE:-SC-AIG}
      LITELLM_FAVICON_URL: /app/assets/favicon.png
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
      - ./assets:/app/assets:ro
      - ./data/license:/app/data
      - ./data/license/license.zayk:/etc/license.zayk
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=5).status==200 else 1)"
          2>/dev/null || echo "liveliness probe failed"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  headroom:
    image: headroom-offline:v1.106.0-zh.7
    restart: unless-stopped
    cap_add: [ALL]
    environment:
      HEADROOM_HOST: 0.0.0.0
      HEADROOM_PORT: "8787"
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN}
      # litellm 从 compose 网络调用 /v1/compress，需放开 remote 路由；
      # 该路由仍要求 Bearer 令牌，且端口只绑定 127.0.0.1。
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      HEADROOM_BEACON: "off"
      HEADROOM_TELEMETRY: "off"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:${HEADROOM_HOST_PORT:-8787}:8787"
    volumes:
      - ./data/headroom:/root/.headroom
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/livez',timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  db:
    image: postgres:16.4
    restart: unless-stopped
    cap_add: [ALL]
    container_name: ${COMPOSE_PROJECT_NAME:-litellm}_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$$POSTGRES_DB\" -U \"$$POSTGRES_USER\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    cap_add: [ALL]
    container_name: ${COMPOSE_PROJECT_NAME:-litellm}_redis
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - "sh"
      - "-c"
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy noeviction
        --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    cap_add: [ALL]
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=365d"
