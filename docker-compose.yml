services:
  litellm:
    build:
      context: .
      args:
        target: runtime
    image: docker.litellm.ai/berriai/litellm:main-stable
    #########################################
    ## Uncomment these lines to start proxy with a config.yaml file ##
    # volumes:
    #  - ./config.yaml:/app/config.yaml
    # command:
    #  - "--config=/app/config.yaml"
    ##############################################
    ports:
      - "4000:4000" # Map the container port to the host, change the host port if necessary
    environment:
      DATABASE_URL: "postgresql://llmproxy:dbpassword9090@db:5432/litellm"
      # Optional: route read-only queries (find_*, count, group_by, query_raw/_first)
      # to a separate reader endpoint, e.g. an Aurora reader. Leave unset for
      # single-DB deployments. With IAM_TOKEN_DB_AUTH enabled, the reader URL
      # is auto-refreshed alongside the writer.
      # DATABASE_URL_READ_REPLICA: "postgresql://llmproxy:dbpassword9090@db-reader:5432/litellm"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
      # Redis backs rate limits, budgets, router state, and cache invalidation
      # across workers. Two workers without it enforce every limit twice.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Software authorization: the gateway refuses to serve traffic until a
      # license file signed for this machine has been imported.
      LITELLM_PRODUCT_LICENSE_ENABLED: "True"
      LITELLM_PRODUCT_LICENSE_FILE: "/app/data/product_license.lic"
    volumes:
      - product_license_data:/app/data
    env_file:
      - .env # Load local .env file
    depends_on:
      db:  # Indicates that this service depends on the 'db' service, ensuring 'db' starts first
        condition: service_started
      redis:  # Ensures Redis is accepting commands before the proxy starts
        condition: service_healthy
    healthcheck:  # Defines the health check configuration for the container
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"  # Command to execute for health check
      interval: 30s  # Perform health check every 30 seconds
      timeout: 10s   # Health check command times out after 10 seconds
      retries: 3     # Retry up to 3 times if health check fails
      start_period: 40s  # Wait 40 seconds after container start before beginning health checks

  db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persists Postgres data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    restart: always
    container_name: litellm_redis
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Requires a password only when REDIS_PASSWORD is set, so the stack works
    # with or without auth against the same compose file.
    command:
      - "sh"
      - "-c"
      - >-
        if [ -n "$${REDIS_PASSWORD}" ]; then
        exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}";
        else
        exec redis-server --appendonly yes --appendfsync everysec;
        fi
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data # Persists the append-only file across container restarts
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping;
          else
          redis-cli ping;
          fi | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    restart: always

volumes:
  prometheus_data:
    driver: local
  postgres_data:
    name: litellm_postgres_data # Named volume for Postgres data persistence
  redis_data:
    name: litellm_redis_data # Named volume for Redis AOF persistence
  product_license_data:
    name: litellm_product_license_data # Persists the imported software license
